# Yazi plugins — managed by yazi's own package manager (`ya pkg install` /
# `ya pkg upgrade`), like LazyVim's self-updating starter.
#
# No `rev`/`hash` pins by default: `ya pkg upgrade` (run via topgrade) tracks
# the latest of each plugin. To pin one after it breaks, add `rev = "<commit>"`
# (and optionally `hash`) to its entry — `ya pkg upgrade` then respects the pin.

[[plugin.deps]]
use = "yazi-rs/plugins:full-border"

[[plugin.deps]]
use = "uhs-robert/recycle-bin"

[[plugin.deps]]
use = "stelcodes/bunny"

[[plugin.deps]]
use = "KKV9/compress"

[[plugin.deps]]
use = "Rolv-Apneseth/starship"

[[plugin.deps]]
use = "yazi-rs/plugins:mount"

[[plugin.deps]]
use = "pirafrank/what-size"

[[plugin.deps]]
use = "imsi32/yatline"

[[plugin.deps]]
use = "wekauwau/yatline-modified-time"

[[plugin.deps]]
use = "pakhromov/yatline-selected-size"

[[plugin.deps]]
use = "pakhromov/yatline-disk-usage"

[[plugin.deps]]
use = "wekauwau/yatline-created-time"

[[plugin.deps]]
use = "Ape/simple-status"

[[plugin.deps]]
use = "ndtoan96/ouch"

[[plugin.deps]]
use = "imsi32/yatline-githead"

[[plugin.deps]]
use = "barbanevosa/linemode-plus"

[[plugin.deps]]
use = "boydaihungst/mediainfo"
