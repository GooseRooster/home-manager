# TTY-friendly theme for lazydocker.
# All colors are SGR names — the host terminal's palette drives the actual
# look. The host terminal palette propagates through
# the TTY and these SGR codes are interpreted against it.
#
# selectedLineBgColor: [default] — no background band. The cell's own color
# (force-bold+bright by gocui's setCharacter regardless of theme) sits on
# the terminal's natural bg instead of competing with a blue band. The
# `reverse` attribute was rejected: gocui applies the swap per-cell, so
# multi-colored rows shimmer.
#
# activeBorderColor: [green, bold] — kept at default. lazydocker wires
# activeBorderColor to SelFgColor (see pkg/gui/theme.go SetColorScheme), so
# this also drives the selected-row fg. They cannot be decoupled through
# the theme YAML.
#
# SGR 2 (dim/faint) is not exposed by the theme attribute map; true dimming
# would require a source patch to pkg/gui/gocui.go and pkg/gocui/view.go.
gui:
  theme:
    activeBorderColor: [green, bold] # SGR 1;32 (also SelFgColor)
    inactiveBorderColor: [default] # SGR 39
    selectedLineBgColor: [default] # SGR 49 (was [blue])
    optionsTextColor: [blue] # SGR 34
