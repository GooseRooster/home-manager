name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # `nix flake check` alone is eval-only for homeConfigurations, so
      # build the activation packages. The wsl target reads $USER/$HOME at
      # eval time (user varies by distro) — build it --impure with dummy
      # values; that's eval-time only, nothing activates.
      - name: Build home configurations
        run: |
          nix build .#homeConfigurations.desktop.activationPackage
          HOME=/home/runner USER=runner nix build --impure .#homeConfigurations.wsl.activationPackage
