name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false # GitHub-native cache only; no FlakeHub account

      # `nix flake check` alone is eval-only for homeConfigurations, so
      # build the activation packages. Both targets read $USER/$HOME at
      # eval time (user varies by distro/image) — build them --impure with
      # dummy values; that's eval-time only, nothing activates.
      # The NixOS desktop home is built by nixos-config's CI, which consumes
      # this repo as a flake input (hmModules.default) — all shared modules
      # (and the plugin fetches) are exercised by these builds here.
      - name: Build home configurations
        run: |
          HOME=/home/runner USER=runner nix build --no-link --impure \
            .#homeConfigurations.container.activationPackage \
            .#homeConfigurations.wsl.activationPackage
