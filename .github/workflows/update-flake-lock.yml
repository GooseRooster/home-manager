name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    # Sundays 03:17 UTC.
    - cron: "17 3 * * 0"

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false # GitHub-native cache only; no FlakeHub account

      # Gate before the PR: build both standalone home configs (need --impure
      # env vars for the $USER/$HOME eval; nothing activates). The NixOS
      # desktop home is gated by nixos-config's CI via the flake input chain.
      - name: Update inputs and build home configurations
        run: |
          nix flake update
          HOME=/home/runner USER=runner nix build --no-link --impure \
            .#homeConfigurations.container.activationPackage \
            .#homeConfigurations.wsl.activationPackage

      - name: Open/update PR
        uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "flake.lock: update nixpkgs / home-manager"
          pr-labels: |
            dependencies
            automated
